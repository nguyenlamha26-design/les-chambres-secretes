<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Chambres Secrètes · The Secret Chambers · Mật Thất</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--gold:#e8c468;--ink:#f3ecd9;--dim:#b9b09a;--bg:#07080c;--panel:rgba(16,18,26,.92);--hud:54px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
h1,h2,h3{font-family:Cambria,"Times New Roman",Georgia,serif;margin:0;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- Scène ---------- */
#wrap{position:fixed;inset:var(--hud) 0 0 0;display:grid;place-items:center;background:#000}
body.nohud #wrap{inset:0}
#stage{position:relative;aspect-ratio:16/9;width:min(100vw,calc((100dvh - var(--hud))*16/9));box-shadow:0 0 80px #000;overflow:hidden}
body.nohud #stage{width:min(100vw,calc(100dvh*16/9))}
#cv{display:block;width:100%;height:100%}
#hs{position:absolute;inset:0}
#stage.holding #hs{cursor:crosshair}
.hs{position:absolute;border:2px solid transparent;border-radius:16px;background:transparent;padding:0;transition:background .2s,border-color .2s,box-shadow .2s}
.hs:hover,.hs:focus-visible{background:rgba(232,196,104,.08);border-color:rgba(232,196,104,.7);box-shadow:0 0 24px rgba(232,196,104,.25);outline:none}
.hs.hid:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.25);box-shadow:none}
#hs.scan .hs:not(.hid),#hs.scan.easy .hs{border-color:rgba(232,196,104,.85);animation:pulse 1.2s infinite}
.hs .lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(8,9,13,.88);border:1px solid rgba(232,196,104,.45);padding:3px 11px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
.hs:hover .lbl,.hs:focus-visible .lbl,#hs.scan .hs:not(.hid) .lbl{opacity:1}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,196,104,.45)}70%,100%{box-shadow:0 0 0 16px rgba(232,196,104,0)}}

.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;display:flex;align-items:center;gap:8px;padding:14px 12px;border:1px solid rgba(232,196,104,.3);background:rgba(8,9,13,.55);border-radius:14px;font:700 22px Georgia,serif;color:var(--gold);transition:background .2s}
.nav span{font:600 13px "Segoe UI",sans-serif;color:var(--ink);max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .3s}
.nav:hover{background:rgba(8,9,13,.85)} .nav:hover span{max-width:220px}
#navL{left:10px} #navR{right:10px}
#vname{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(8,9,13,.6);border:1px solid rgba(232,196,104,.25);border-radius:20px;padding:3px 16px;font:600 14px Cambria,Georgia,serif;color:var(--gold);pointer-events:none}
#invbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:92%}
#heldLbl{font-size:12px;color:var(--gold);background:rgba(8,9,13,.75);padding:1px 10px;border-radius:10px;min-height:0}
#heldLbl:empty{display:none}
#inv{display:flex;gap:6px;padding:6px 8px;background:rgba(8,9,13,.72);border:1px solid rgba(232,196,104,.3);border-radius:14px;min-height:56px;align-items:center;flex-wrap:wrap;justify-content:center}
#inv .empty{opacity:.35;font-size:24px;padding:0 10px}
.it{width:46px;height:46px;border-radius:10px;border:2px solid #3a3f55;background:radial-gradient(circle at 40% 30%,#2a2e3e,#12141c);font-size:26px;display:grid;place-items:center;transition:transform .15s,border-color .15s}
.it:hover{transform:translateY(-3px);border-color:var(--gold)}
.it.held{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,196,104,.35),0 0 20px rgba(232,196,104,.5);transform:translateY(-5px)}
.it.new{animation:newit .9s}
@keyframes newit{0%{transform:scale(2.2) translateY(-30px);opacity:0}60%{transform:scale(.9)}100%{transform:none}}
#msg{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:4;width:min(760px,88%);background:linear-gradient(rgba(14,15,22,.95),rgba(10,11,16,.95));border:1px solid rgba(232,196,104,.5);border-radius:14px;padding:12px 18px;font:17px/1.55 Cambria,"Times New Roman",Georgia,serif;color:#efe6cf;box-shadow:0 10px 40px #000a;cursor:pointer}
#msg.in{animation:rise .3s}
@media (max-width:820px){#msg{font-size:14px;bottom:76px;padding:8px 12px}.it{width:38px;height:38px;font-size:21px}#inv{min-height:46px}.nav{padding:8px 7px;font-size:18px}}

/* ---------- Bandeau ---------- */
#hud{position:fixed;inset:0 0 auto 0;height:var(--hud);display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(#14161f,#0b0c12);border-bottom:1px solid rgba(232,196,104,.25);z-index:5;white-space:nowrap}
#hud .name{font:600 16px Cambria,Georgia,serif;color:var(--gold);overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
#timer{font:700 22px Consolas,"Courier New",monospace;padding:2px 10px;border-radius:8px;background:#05060a;border:1px solid #2b2e3c;color:#9dffb8}
#timer.low{color:#ff6a6a;animation:blink 1s infinite}
#slots{display:flex;gap:3px}
#slots span{display:flex;align-items:center;gap:3px;padding:2px 5px;border-radius:8px;background:#05060a;border:1px solid #2b2e3c;font-size:13px;color:var(--dim)}
#slots b{font:700 17px Consolas,monospace;color:#555}
#slots span.on{border-color:var(--gold);color:var(--gold)} #slots span.on b{color:var(--gold)}
.ib{background:#191c27;border:1px solid #2f3344;border-radius:8px;padding:5px 10px;font-size:14px}
.ib:hover{border-color:var(--gold)}
.lg{background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;font-size:13px;color:var(--dim)}
.lg.on{color:var(--gold);border-color:rgba(232,196,104,.5)}
@keyframes blink{50%{opacity:.45}}
@media (max-width:900px){#hud .name{display:none}#slots span{padding:1px 3px;font-size:11px}#slots b{font-size:14px}#timer{font-size:17px}.ib{padding:4px 6px;font-size:13px}#hud{gap:5px;padding:0 6px}}
@media (max-width:560px){#jBtn{font-size:0}#jBtn::before{content:"📖";font-size:14px}#hudLangs .lg{padding:2px 3px}}

/* ---------- Écrans ---------- */
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow:auto;padding:14px;background:radial-gradient(ellipse at center,rgba(7,8,12,.5),rgba(7,8,12,.93));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#modal{background:radial-gradient(ellipse at center,rgba(7,8,12,.35),rgba(7,8,12,.85))}
.panel{width:min(800px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--panel);border:1px solid rgba(232,196,104,.35);border-radius:18px;box-shadow:0 30px 80px #000c,inset 0 1px 0 rgba(255,255,255,.06);padding:20px 24px;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.panel.shake{animation:shake .4s}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}}
.btn{background:#1d2130;border:1px solid #3a3f55;border-radius:10px;padding:9px 18px;font-weight:600;transition:transform .12s,box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(#f3d78a,#c99a35);color:#241a05;border-color:#f6e2a8;box-shadow:0 6px 22px rgba(232,196,104,.3)}
.btn.big{font-size:19px;padding:13px 34px;border-radius:14px}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px}

/* Menu */
#menu .mwrap{width:min(1180px,100%);text-align:center;padding:10px 0 24px}
#menu h1{font-size:clamp(34px,6vw,62px);background:linear-gradient(#fff2c4,#e8c468 55%,#9a6f1f);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .9s both}
.tagline{color:var(--dim);margin:4px 0 16px;animation:up .9s .1s both}
#menu h3{font-size:15px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);margin:16px 0 10px;opacity:.85}
.langs{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.langs .lg{font-size:15px;padding:5px 12px}
.scs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sc{padding:0;background:#11131b;border:2px solid #2a2d3b;border-radius:14px;overflow:hidden;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s;animation:up .7s both}
.sc:nth-child(2){animation-delay:.07s}.sc:nth-child(3){animation-delay:.14s}.sc:nth-child(4){animation-delay:.21s}
.sc canvas{display:block;width:100%;aspect-ratio:16/9;filter:saturate(.8) brightness(.85);transition:filter .2s}
.sc:hover{transform:translateY(-4px)} .sc:hover canvas,.sc.on canvas{filter:none}
.sc.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,196,104,.25),0 14px 40px #000a}
.sct{padding:9px 12px 11px;display:flex;flex-direction:column;gap:2px}
.sct b{font:600 16px Cambria,Georgia,serif} .sct small{color:var(--dim);font-size:12.5px;line-height:1.35} .sct em{font-style:normal;font-size:12px;color:var(--gold);min-height:16px}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:820px;margin:0 auto 20px}
.lv{background:#11131b;border:2px solid #2a2d3b;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.lv b{font-size:16px} .lv small{color:var(--dim);font-size:12.5px}
.lv.on{border-color:var(--gold);background:#1b1a14}
@keyframes up{from{opacity:0;transform:translateY(18px)}}

@media (max-width:820px){.scs{grid-template-columns:repeat(2,1fr)}.lvs{grid-template-columns:1fr}}

/* Intro / fin */
.story{text-align:center}
.story .ico{font-size:54px;line-height:1}
.story h2{font-size:30px;color:var(--gold);margin:6px 0 10px}
.story p{font:18px/1.7 Cambria,"Times New Roman",Georgia,serif;color:#e9e1cc;margin:0 auto 8px;max-width:640px}
.story p.tip,.tip{font:14px/1.5 "Segoe UI",sans-serif;color:var(--dim);background:rgba(232,196,104,.07);border:1px solid rgba(232,196,104,.2);border-radius:10px;padding:8px 12px;max-width:640px;margin:10px auto}
.stars{font-size:54px;letter-spacing:8px;color:#3a3a44}
.stars i{font-style:normal;display:inline-block;animation:starpop .5s both}
.stars i.on{color:var(--gold);text-shadow:0 0 24px rgba(232,196,104,.8)}
.stars i:nth-child(2){animation-delay:.25s}.stars i:nth-child(3){animation-delay:.5s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg);opacity:0}}
.stats{display:flex;justify-content:center;gap:26px;margin:10px 0;color:var(--dim)} .stats b{display:block;font:700 26px Consolas,monospace;color:var(--ink)}
.nb{color:#62d48a;font-weight:700}

/* ---------- Fenêtres ---------- */
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph h2{flex:1;font-size:23px;color:var(--gold)}
.ctx{font:italic 17px/1.6 Cambria,"Times New Roman",Georgia,serif;color:#e9dfc4;margin:0 0 8px;padding-left:12px;border-left:3px solid rgba(232,196,104,.5)}
.ins{color:#cfc7b2;margin:0 0 14px;font-size:15px}
.cnt{text-align:center;color:var(--dim);margin:10px 0 0;font-size:14px}
#hintbox p{margin:10px 0 0;padding:9px 13px;border-left:3px solid var(--gold);background:rgba(232,196,104,.09);border-radius:0 8px 8px 0;font-size:15px}
#fb{text-align:center;min-height:24px;margin-top:10px;color:#ff8a8a;font-weight:600}
input.ans{width:min(300px,60vw);font:600 22px Georgia,serif;text-align:center;letter-spacing:.08em;padding:9px 12px;border-radius:10px;border:2px solid #3a3f55;background:#07080c;color:var(--ink);outline:none;text-transform:uppercase}
input.ans:focus{border-color:var(--gold)}

.doc{border-radius:6px;padding:20px 24px;font:18px/1.75 Cambria,"Times New Roman",Georgia,serif;box-shadow:0 8px 24px #0008}
.doc.paper{background:linear-gradient(#f6efdc,#e8dcbd);color:#2a2118}
.doc.note{background:linear-gradient(#fbe98a,#f1d35e);color:#2a2118;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:17px;transform:rotate(-.6deg)}
.doc.old{background:radial-gradient(ellipse at 30% 20%,#efe0b8,#cdb47e);color:#3a2410;box-shadow:inset 0 0 60px rgba(90,50,10,.4),0 8px 24px #0008}
.doc.termdoc{background:#03140d;color:#62ffa6;font:16px/1.75 Consolas,"Courier New",monospace;border:2px solid #1c4a32;text-shadow:0 0 8px rgba(80,255,150,.45)}
.doc .code,.ciph{display:block;text-align:center;font:700 24px/1.6 Consolas,"Courier New",monospace;letter-spacing:.12em;word-spacing:.3em}
.doc table.tt{border-collapse:collapse;width:100%;margin-bottom:10px;font-family:"Segoe UI",sans-serif;font-size:16px}
.doc table.tt td{border-bottom:1px solid #b9c7e0;padding:5px 8px} .doc table.tt td:first-child{font-weight:700;width:90px;color:#2e4f9a}
.doc .hand{font-family:"Segoe Print","Comic Sans MS",cursive;color:#7a2f9a;font-size:16px}
.gkey{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.gkey span{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.12);border-radius:6px;padding:4px;font:700 16px Georgia,serif}
.gkey b{font:22px "Segoe UI Symbol",Georgia,serif}
#modal .gkey span{background:#1d2130;color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:#1d2130;border:1px solid #3a3f55;border-radius:20px;padding:5px 14px;font-size:14px}
.tab.on{border-color:var(--gold);color:var(--gold)}
.jlist{display:flex;flex-direction:column;gap:6px} .jlist .btn{text-align:left}
.jnotes{margin:0;padding-left:20px;line-height:1.9}
.jcode{display:flex;justify-content:center;gap:12px} .jcode div{display:flex;flex-direction:column;align-items:center;background:#07080c;border:1px solid #3a3f55;border-radius:10px;padding:8px 16px}
.jcode span{color:var(--gold);font-size:22px} .jcode b{font:700 34px Georgia,serif}

.paper{background:linear-gradient(#f4ead2,#e6d8b6);color:#2a2118;padding:18px 22px;border-radius:6px;font:19px/1.9 Georgia,serif;box-shadow:0 8px 24px #0008,inset 0 0 40px rgba(120,90,40,.2)}
.paper.class{background:linear-gradient(135deg,#17392f,#0e241f);color:#eef3ea;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:18px;border:8px solid #5a3b22}
:lang(vi) .paper.class{font-family:"Segoe UI",system-ui,sans-serif}
.paper.ship{background:radial-gradient(ellipse at 30% 20%,#efe0b8,#cdb47e);color:#3a2410}
.paper.station{background:#03140d;color:#62ffa6;font:17px/1.9 Consolas,"Courier New",monospace;border:2px solid #1c4a32;text-shadow:0 0 8px rgba(80,255,150,.5)}
.w{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .15s}
.w:hover{background:rgba(232,196,104,.3)}
.w.no{background:rgba(255,80,80,.45);animation:shake .4s}
.w.fixed{background:rgba(110,220,140,.22);cursor:default}
.w.tip{outline:2px dashed var(--gold);animation:blink 1s infinite}
.w mark{background:var(--gold);color:#221a08;border-radius:3px;padding:0 3px;font-weight:700;text-shadow:none}
.letters{display:flex;justify-content:center;gap:8px;margin-top:16px;min-height:52px}
.letters b{width:44px;height:52px;display:grid;place-items:center;border-radius:8px;background:#07080c;border:2px solid #3a3f55;font:700 26px Georgia,serif;color:#555}
.letters b.on{border-color:var(--gold);color:var(--gold);animation:pop .4s}

.lampwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 0 4px}
.lamp{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4030,#15120c);border:5px solid #6b5a33}
.lamp.on{background:radial-gradient(circle at 40% 35%,#fffbe0,#ffd35a 45%,#e08a00);box-shadow:0 0 60px 25px rgba(255,200,80,.75),0 0 140px 60px rgba(255,170,40,.35)}
.trans{min-height:18px;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:5px}
.dot,.dash,.gap{display:inline-block;height:9px;background:var(--gold);border-radius:5px}
.dot{width:9px}.dash{width:26px}.gap{width:16px;background:transparent}
.mtable{margin-top:16px;background:#f6f3ea;color:#16161a;border-radius:10px;padding:10px 14px}
.mtable summary{font:700 15px Arial,sans-serif;text-align:center;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px 14px;margin-top:10px}
.mgrid span{display:flex;align-items:center;gap:4px}
.mgrid b{width:20px;font:700 16px Arial,sans-serif}
.mgrid .dot,.mgrid .dash{background:#16161a;height:7px}.mgrid .dot{width:7px}.mgrid .dash{width:18px;border-radius:2px}
.term{background:#03140d;color:#62ffa6;font:16px/1.6 Consolas,monospace;border:2px solid #1c4a32;border-radius:8px;padding:14px 16px;text-shadow:0 0 8px rgba(80,255,150,.45)}
.term .cur{animation:blink 1s infinite}

.rebus{display:flex;justify-content:center;align-items:center;gap:14px;font-size:clamp(46px,10vw,78px);padding:14px 0;flex-wrap:wrap}
.rebus span{background:#fdfaf0;border-radius:18px;padding:6px 16px;box-shadow:0 10px 26px #0009;animation:pop .5s both}
.rebus span:nth-of-type(2){animation-delay:.15s}
.rebus i{font-style:normal;font-size:.6em;color:var(--gold)}
.rebus .q{background:var(--gold);color:#221a08;font-family:Georgia,serif;font-weight:700;animation-delay:.3s}

.eqs{width:fit-content;margin:6px auto;background:linear-gradient(#f4ead2,#e6d8b6);color:#2a2118;border-radius:6px;padding:14px 34px;font:700 30px/1.5 Consolas,"Courier New",monospace;box-shadow:0 8px 24px #0008;transform:rotate(-1deg)}
.eqs i{font-style:normal;color:#9a6f1f;margin:0 6px}
.eqs .qq{border-top:2px dashed #b7a57b;margin-top:6px;padding-top:6px} .eqs .qq b{color:#b8242c}

.cardrows{display:flex;flex-direction:column;gap:8px;align-items:center}
.crow{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.card{width:52px;height:74px;border-radius:8px;background:linear-gradient(#fff,#ebe5d5);color:#1b1b22;border:2px solid #cfc7b0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 21px/1.05 Georgia,serif;padding:0;transition:transform .15s,box-shadow .15s;animation:deal .45s both}
.card span{font-size:24px}
.card.red{color:#c2202c}
.card:hover{transform:translateY(-4px)}
.card.sel{transform:translateY(-9px);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 12px 22px #000b}
@keyframes deal{from{opacity:0;transform:translateY(-30px) rotate(-12deg)}}
.dlg{margin:14px auto 0;max-width:600px;display:flex;flex-direction:column;gap:6px}
.dlg p{margin:0;padding:8px 13px;border-radius:14px;background:#1d2130;width:fit-content;max-width:88%}
.dlg p.b{align-self:flex-end;background:#2a2416}
.dlg b{color:var(--gold);margin-right:6px}

/* Roue de chiffrement */
.ciph.dec{color:#9dffb8;font-size:20px;margin-top:8px}
.wheel{margin:12px auto 0;max-width:640px;overflow-x:auto;background:#0b0d14;border:1px solid #3a3f55;border-radius:12px;padding:8px}
.wl{display:flex;align-items:center;gap:6px} .wl small{width:56px;color:var(--dim);font-size:11px;text-align:right}
.abc{display:grid;grid-template-columns:repeat(26,1fr);flex:1;min-width:420px}
.abc i{font:700 14px Consolas,monospace;font-style:normal;text-align:center;padding:2px 0;color:var(--ink)}
.abc.enc i{color:var(--gold);border-top:1px dashed #3a3f55}
.shift{font-size:15px;min-width:110px;text-align:center} .shift b{color:var(--gold);font-size:20px}
.glyphs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.glyphs span{width:62px;height:72px;display:grid;place-items:center;background:linear-gradient(#6a6552,#3e3b2f);border-radius:8px;font:34px "Segoe UI Symbol",Georgia,serif;color:#f2e2b0;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 6px 14px #0008}

/* Interrupteurs */
.lgrid{display:grid;gap:8px;width:min(320px,80vw);margin:6px auto}
.lc{aspect-ratio:1;border-radius:12px;border:2px solid #2a2e3c;background:radial-gradient(circle at 40% 35%,#2a2e3a,#0d0f15);transition:background .2s,box-shadow .2s}

.lc.tip{outline:3px dashed #7ad1ff;animation:blink 1s infinite}
/* Mémoire */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(280px,70vw);margin:6px auto}
.pad{aspect-ratio:1.4;border-radius:16px;border:3px solid #0008;opacity:.45;transition:opacity .1s,box-shadow .1s}
.pad.red{background:#d33a2c}.pad.blue{background:#2e6fd1}.pad.yellow{background:#efd23a}.pad.green{background:#3fa34d}
.pad.lit,.pad:active{opacity:1;box-shadow:0 0 30px currentColor,0 0 30px #fff8}
/* Horloge */
svg.clk{display:block;width:min(240px,60vw);margin:0 auto}
.clk .rim{fill:#b8964e}.clk .face{fill:#fbf6e8}.clk text{font:700 15px Georgia,serif;text-anchor:middle;fill:#2b2418}
.clk .hh{stroke:#1e1a12;stroke-width:7;stroke-linecap:round;transition:transform .2s}.clk .mh{stroke:#1e1a12;stroke-width:4;stroke-linecap:round}.clk .pin{fill:#1e1a12}
.ctl{display:flex;align-items:center;gap:6px;background:#11131b;border:1px solid #2a2d3b;border-radius:10px;padding:4px 8px}
.ctl .btn{padding:4px 14px}
/* Séquences */
.sheet{text-align:center;font:600 18px Georgia,serif;background:#fbf6e8;color:#2a2118;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.seq{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.seq button.hit{animation:hit .3s}
@keyframes hit{50%{transform:translateY(6px) scale(.96)}}
.book{width:44px;height:170px;border-radius:4px 4px 2px 2px;border:none;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%,rgba(0,0,0,.4)),var(--c);box-shadow:0 6px 12px #0008;display:flex;align-items:center;justify-content:center;padding:0}
.book span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 13px Georgia,serif;color:#fff;text-shadow:0 1px 2px #000;letter-spacing:.08em}

.key{width:46px;height:150px;background:linear-gradient(#fff,#e6e2d8);border:1px solid #888;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:700 13px Georgia,serif;color:#333}
.key:active,.key.hit{background:linear-gradient(#ffe9a8,#f1c55a)}
.idol{width:110px;padding:10px 6px;border-radius:12px;background:linear-gradient(#5a5646,#2e2b21);border:2px solid #6a6552;display:flex;flex-direction:column;align-items:center;gap:4px}
.idol b{font-size:42px;filter:grayscale(.6) sepia(.4)} .idol span{font-size:13px;color:#e9dfc4}

.prog{display:flex;justify-content:center;gap:6px;margin-top:10px}

/* Taquin */
.slide{position:relative;width:min(380px,78vw);aspect-ratio:1;margin:0 auto;background:#07080c;border:3px solid #6b5a33;border-radius:8px;overflow:hidden}
.slide img{width:100%;height:100%;display:block;animation:pop .5s}
.tile{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));border:1px solid rgba(0,0,0,.5);background-size:calc(var(--n) * 100%);padding:0;transition:left .12s,top .12s}
.tile em{position:absolute;left:4px;top:2px;font:700 13px Georgia,serif;font-style:normal;color:#fff;text-shadow:0 1px 3px #000}
/* Circuit */
.pipes{position:relative;width:min(380px,76vw);margin:0 auto;padding:0 22px}

.pt div{width:100%;height:100%;transition:transform .15s}
.pt svg{width:100%;height:100%;display:block}
.pt polyline{fill:none;stroke:#4a5068;stroke-width:22;stroke-linecap:round}
.pt circle{fill:#4a5068}

.pipes.station .pt.live polyline,.pipes.station .pt.live circle{stroke:#ffd24a;fill:#ffd24a}
.pt.live polyline,.pt.live circle{stroke:#62d48a;fill:#62d48a}
.pt.tip{outline:3px dashed #ff8a8a;animation:blink 1s infinite}
.io{position:absolute;transform:translateY(-50%);color:var(--gold);font-size:18px}
.io.in{left:0}.io.out{right:0}
/* Carte */
.dirs{text-align:center;font:600 17px Georgia,serif;background:#efe0b8;color:#3a2410;border-radius:8px;padding:8px;margin-bottom:10px}
.map{display:grid;gap:2px;width:min(380px,78vw);margin:0 auto;background:#6b4a2a;padding:4px;border-radius:6px}

.winbox{text-align:center;padding:10px 0}

:root{--gold:#ffd27a;--panel:rgba(18,16,30,.86)}

/* fenêtres */

/* menu */
#menu h1{font-weight:800;filter:drop-shadow(0 4px 0 #6a4210) drop-shadow(0 0 30px rgba(255,190,80,.45))}
.sc{border-radius:20px;border:3px solid #3a3050;background:#1a1426;box-shadow:0 8px 24px #0009}

/* ---------- Crédit ---------- */
.credit{text-align:center;margin:26px 0 6px;color:var(--dim);font-size:15px;letter-spacing:.02em}.credit b{color:var(--gold);font-weight:800}

.lockth.mafia .dial .num{background:linear-gradient(#c9a050,#5a3a10 50%,#c9a050);color:#1a1008;border-color:#e8c468}

/* ---------- Récits : journal, lettre, miroir, écritures, formulaire ---------- */
.lbk{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:920px;box-sizing:border-box;margin:6px auto;text-align:left}
@media (max-width:700px){.lbk,.tn{grid-template-columns:1fr!important}}
.lbk h4,.tnp h4{margin:0 0 6px;color:var(--gold);font:700 15px Cambria,Georgia,serif;width:100%}
.lbk-loose{display:flex;flex-direction:column;gap:9px;max-height:50vh;overflow:auto;padding:6px}
.lpage{background:linear-gradient(#f4ead0,#e2d0a8);color:#2a1a0a;border:none;border-radius:3px;padding:9px 13px;text-align:left;font:15px/1.45 Cambria,Georgia,serif;transform:rotate(var(--r));box-shadow:0 3px 8px #0007;clip-path:polygon(0 5%,4% 0,30% 3%,62% 0,100% 2%,98% 45%,100% 100%,70% 96%,38% 100%,0 97%);cursor:pointer;transition:transform .15s;flex-shrink:0}
.lpage:hover{transform:rotate(0) scale(1.02)}.lpage.bad{animation:shake .4s}
.lpage b{display:block;font:700 13px Cambria,Georgia,serif;color:#7a2a1a;margin-bottom:2px}.lpage b.torn{color:#a08a68;font-style:italic;font-weight:400}
.lbk-book{background:linear-gradient(90deg,#cdbb90,#f2e6c8 5%,#f2e6c8);color:#2a1a0a;border-radius:6px;padding:10px 16px;max-height:50vh;overflow:auto;box-shadow:inset 8px 0 12px #0003,0 6px 16px #0008;font:15px/1.5 Cambria,Georgia,serif}
.lbk-book h4{color:#5a1a1a;border-bottom:2px solid #8a6a4a;padding-bottom:4px}.lbk-book .lline{border-bottom:1px dashed #c0ac80;padding:5px 0}.lbk-book .lline.nw{animation:up .35s}.lbk-book .lline b{color:#7a2a1a}.lempty{color:#8a7a5a;font-style:italic}
.lbk.receipt .lpage{background:#fbfbf6;font:14px/1.45 Consolas,"Courier New",monospace;clip-path:polygon(0 0,100% 0,100% 94%,95% 100%,90% 94%,85% 100%,80% 94%,75% 100%,70% 94%,65% 100%,60% 94%,55% 100%,50% 94%,45% 100%,40% 94%,35% 100%,30% 94%,25% 100%,20% 94%,15% 100%,10% 94%,5% 100%,0 94%);padding-bottom:16px}
.lbk.receipt .lpage b{color:#5a3a8a;font-family:Consolas,monospace}.lbk.receipt .lbk-book{background:#f6f2fa;box-shadow:0 6px 16px #0008;font-family:"Segoe UI",sans-serif}.lbk.receipt .lbk-book h4,.lbk.receipt .lline b{color:#5a3a8a}
.tn{display:grid;grid-template-columns:1fr 1.25fr;gap:14px;width:100%;max-width:920px;box-sizing:border-box;margin:6px auto;text-align:left}
.tnp{display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;justify-content:center}
.strip{background:#f6f1e4;color:#1a2a7a;border:none;padding:8px 14px;font:16px/1.35 "Segoe Print","Comic Sans MS",cursive;transform:rotate(var(--r));box-shadow:0 2px 6px #0006;clip-path:polygon(0 10%,3% 0,40% 6%,97% 2%,100% 12%,99% 90%,96% 100%,50% 94%,4% 100%,0 88%);cursor:pointer;text-align:left;max-width:100%}
.strip:hover{transform:rotate(0) scale(1.03)}
.tnl{background:#f6f1e4 repeating-linear-gradient(transparent 0 27px,#c8d4f0 27px 28px);color:#1a2a7a;border-radius:4px;padding:12px 18px;font:16px/28px "Segoe Print","Comic Sans MS",cursive;min-height:240px;box-shadow:0 6px 16px #0008}
.tnl p{margin:0;cursor:pointer}.tnl p.nw{animation:up .3s}.tnl p:hover{text-decoration:line-through}.tnl p.fx{cursor:default;text-decoration:none}.tnl p.sig{text-align:center;opacity:.4}
.tn.kid .strip,.tn.kid .tnl{color:#6a2aa0}.tn.kid .tnl{background-color:#f8f0ff}
.refl{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:720px;margin:0 auto}
.rmirror{position:relative;width:min(460px,92vw);min-height:150px;border-radius:46% 46% 16px 16px/30% 30% 16px 16px;background:radial-gradient(ellipse at 45% 30%,#4a5070,#141826 72%);border:10px solid #c9a050;box-shadow:inset 0 0 40px #000c,0 8px 24px #000a;display:grid;place-items:center;padding:34px 30px 22px;overflow:hidden;transition:filter .4s}
.rmirror::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.1) 45%,transparent 60%);pointer-events:none}
.rface{position:absolute;left:50%;bottom:-40px;width:170px;height:210px;transform:translateX(-50%);background:radial-gradient(circle at 50% 28%,rgba(190,180,230,.22) 0 22%,transparent 23%),radial-gradient(ellipse at 50% 100%,rgba(190,180,230,.16) 0 50%,transparent 51%);animation:rsway 5s ease-in-out infinite}
@keyframes rsway{50%{transform:translateX(-44%)}}
.rsay{position:relative;z-index:1;font:italic 18px/1.5 Cambria,Georgia,serif;color:#f0eaff;text-align:center;text-shadow:0 0 10px #8a6aff}.rsay.end{color:#fff4d0;text-shadow:0 0 12px #ffd27a}
.rsay.flip{animation:rflip 1.8s both}@keyframes rflip{0%,50%{transform:scaleX(-1);filter:blur(.6px);opacity:.75}100%{transform:none;filter:none;opacity:1}}
.refl.fog .rmirror{filter:blur(1.5px) saturate(.3) brightness(.8)}
.rtrust{display:flex;gap:7px}.rtrust i{width:14px;height:14px;border-radius:50%;border:2px solid #a88ae8}.rtrust i.on{background:#c8a8ff;box-shadow:0 0 8px #c8a8ff}
.rlog{width:100%;max-height:20vh;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rlog div{padding:5px 10px;border-radius:12px;max-width:85%;text-align:left}.rlog small{display:block;font-size:11px;opacity:.65}
.rl-a{background:#2a2244;align-self:flex-start}.rl-b{background:#1e3a30;align-self:flex-end}
.ropts{display:flex;flex-direction:column;gap:6px;width:100%}.ropt{text-align:left;white-space:normal;font-size:15px;line-height:1.35}
.rreact{color:#ffaaaa;font-style:italic;margin:0;text-align:center}
.hrules{background:#f2e8d0;color:#2a1a0a;border-radius:8px;padding:6px 14px;font:14px/1.5 Cambria,Georgia,serif;width:fit-content;max-width:94%;margin:4px auto;text-align:left}
.hnotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;width:100%;max-width:880px;margin:6px auto}
.hnote{display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:#fdfcf6;color:#1a1a22;border:3px solid #c8c4b8;border-radius:12px;padding:10px 12px;text-align:left;font:15px/1.4 "Segoe UI",sans-serif;box-shadow:0 3px 8px #0006}
.hnote em{align-self:flex-end;font-style:normal;font-weight:800;padding:2px 12px;border-radius:10px;background:#e4e0d4;color:#5a5a5a}
.hnote.a0{border-color:#3a7ae8}.hnote.a0 em{background:#3a7ae8;color:#fff}.hnote.a1{border-color:#9a4ae8}.hnote.a1 em{background:#9a4ae8;color:#fff}
.rform{background:#f4f0e2;color:#1a1a1a;border-radius:4px;padding:12px 18px;width:100%;max-width:700px;box-sizing:border-box;margin:6px auto;text-align:left;font:15px Cambria,Georgia,serif;box-shadow:0 6px 16px #0008}
.rform h4{margin:0 0 8px;font:700 13px "Courier New",monospace;text-align:center;border-bottom:2px solid #1a1a1a;padding-bottom:6px}
.rform ol{margin:0;padding-left:22px}.rform li{margin:8px 0}.rform li div{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rform .btn{background:#fff;color:#1a1a1a;border:2px solid #8a8a7a;font-size:14px;padding:4px 12px;box-shadow:none}.rform .btn.on{background:#1a3a7a;color:#fff;border-color:#1a3a7a}
.lockth.phare .dial .num{background:linear-gradient(#c9a050,#5a3a10 50%,#c9a050);color:#fff8e0;border-color:#e8c468}
.lockth.other .dial .num{background:linear-gradient(#8a5ac8,#3a1a5a 50%,#8a5ac8);color:#fff;border-color:#c8a8ff}
</style>
